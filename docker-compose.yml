services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: local_dev
      POSTGRES_PASSWORD: local_dev
      POSTGRES_DB: simple_bot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_dev -d simple_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://local_dev:local_dev@db:5432/simple_bot_db
      WEBHOOK_SECRET: test-secret
      LOG_LEVEL: INFO
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
