[project]
name = "simple-bot-messages-api"
version = "1.0.0"
description = "Простое REST API для обработки сообщений от бота"
readme = "README.md"
authors = [
    { name = "Скатинцев Дмитрий Сергеевич", email = "d.chistyakov@samolet.ru" },
]
requires-python = ">=3.13, <3.14"
dependencies = [
    "aiohttp~=3.14.4",
    "asyncpg~=0.32.0",
    "fastapi[standard-no-fastapi-cloud-cli]~=0.142.2",
    "pydantic",
    "pydantic-settings",
    "pytest~=9.1.1",
    "sqlalchemy[asyncio]~=2.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
